services:
  taco:
    build: .
    image: taco
    container_name: taco
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # taco always looks for stacks in /stacks. Relative paths in compose files
      # (./data) resolve under /stacks, which the docker daemon reads on the HOST,
      # so use absolute host paths for bind mounts.
      - /opt/stacks:/stacks
      - taco-data:/data

volumes:
  taco-data:
